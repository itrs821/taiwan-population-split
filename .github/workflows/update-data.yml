# 每月自動抓最新村里人口、重建資料；有變動就提交（提交後會觸發部署）
name: Update population data

on:
  schedule:
    - cron: '0 2 20 * *' # 每月 20 日 UTC 02:00（戶政司約於每月中旬公布上月資料）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update
      - name: Commit if changed
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "資料沒有變動"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-raw public/data
          git commit -m "更新人口資料 $(cat data-raw/latest.txt)"
          git push
